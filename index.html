<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>13支計分板</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif;background:#f2f5f9;margin:0;color:#202631}main{max-width:900px;margin:auto;padding:14px}h1{text-align:center;font-size:29px;margin:25px 0}.panel{background:white;border-radius:17px;padding:16px;margin:15px 0;box-shadow:0 2px 12px #0000000a}h2{font-size:21px;margin:4px 0 16px}select,input,button{font:inherit}select{padding:10px;border:1px solid #b9c5d4;border-radius:9px;background:#e9f0fc;font-size:19px}button{border:0;border-radius:9px;padding:12px 10px;font-size:17px;cursor:pointer;background:#e4e9ef;color:#155bb4}button.primary{background:#3068c4;color:white}button.danger{background:#b23b3e;color:white}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1}.names{display:grid;gap:7px}.names input{width:100%;min-width:0;text-align:center;padding:9px 3px;border:1px solid #bac1ca;border-radius:7px;font-size:16px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;table-layout:fixed}td,th{border:1px solid #cbd0d7;text-align:center;padding:5px 2px;min-width:0}th{background:#e6ecf5;font-size:13px;overflow-wrap:anywhere}th:first-child{width:54px}td input{width:100%;min-width:0;height:42px;text-align:center;border:1px solid #d0b77e;background:#fff4d6;border-radius:7px;font-size:17px;padding:2px}td.auto{background:#f0f1f3;color:#666;font-size:14px}td.diag{color:#888}tfoot td{background:#e8f3eb;font-weight:bold}.hint{font-size:14px;color:#68717b;line-height:1.7;margin:10px 0 0}.history{font-size:13px}.history th:first-child{width:42px}.history td{padding:9px 2px}.notice{color:#a33;font-weight:bold;font-size:14px}.status{font-size:14px;color:#28714a;margin-top:8px}@media(max-width:480px){main{padding:10px}.panel{padding:12px}h1{font-size:26px}th:first-child{width:39px}td,th{padding:3px 1px}td input{font-size:15px;height:39px}.history{font-size:11px}}</style></head><body><main><h1>🃏 13支計分板</h1><section class="panel"><label for="count"><b>遊戲人數：</b></label><select id="count"><option value="4">4人</option><option value="5">5人</option><option value="6">6人</option><option value="7">7人</option></select><p class="hint">可選擇 4～7 人。切換人數會清除本次紀錄，系統會先詢問確認。</p></section><section class="panel"><h2>玩家姓名</h2><div id="names" class="names"></div></section><section class="panel"><h2>本局計分</h2><div id="score" class="tablewrap"></div><p class="hint">只需在黃色格子輸入分數，對應負分自動產生。負數可直接輸入 -2。</p><div class="actions"><button class="primary" id="save">儲存本局</button><button id="clear">清空輸入</button></div><div id="status" class="status"></div></section><section class="panel"><h2>歷史紀錄（最多20局）</h2><div id="history" class="tablewrap"></div><div class="actions"><button id="undo">撤銷上一局</button><button class="danger" id="reset">清除全部紀錄</button></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const KEY='13zhi-scoreboard-v3';let n=4,names=[],values=[],records=[];try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Number.isInteger(s.n)&&s.n>=4&&s.n<=7){n=s.n;names=s.names||[];records=s.records||[]}}catch(e){};const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({n,names,records}))}catch(e){}};const player=i=>names[i]||`玩家${i+1}`;function render(){ $('count').value=String(n);$('names').style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;$('names').innerHTML='';for(let i=0;i<n;i++){let x=document.createElement('input');x.value=names[i]||'';x.placeholder=`玩家${i+1}`;x.setAttribute('aria-label',`玩家${i+1}姓名`);x.addEventListener('input',()=>{names[i]=x.value;persist();updateLabels();renderHistory()});$('names').append(x)}renderScore();renderHistory()};function renderScore(){let html='<table><thead><tr><th></th>';for(let j=0;j<n;j++)html+=`<th data-player="${j}">${player(j)}</th>`;html+='</tr></thead><tbody>';for(let i=0;i<n;i++){html+=`<tr><th data-player="${i}">${player(i)}</th>`;for(let j=0;j<n;j++){if(i===j)html+='<td class="diag">—</td>';else if(i>j)html+=`<td><input inputmode="numeric" type="number" step="1" data-i="${i}" data-j="${j}" aria-label="${player(i)}對${player(j)}的分數"></td>`;else html+=`<td class="auto" id="auto-${i}-${j}"></td>`}html+='</tr>'}html+='</tbody><tfoot><tr><th>合計</th>';for(let j=0;j<n;j++)html+=`<td id="total-${j}">0</td>`;html+='</tr></tfoot></table>';$('score').innerHTML=html;values=Array.from({length:n},()=>Array(n).fill(null));document.querySelectorAll('#score input').forEach(x=>x.addEventListener('input',()=>{const i=+x.dataset.i,j=+x.dataset.j;values[i][j]=x.value.trim()===''?null:Number(x.value);updateScores()}));updateScores()};function updateScores(){const sums=Array(n).fill(0);for(let i=0;i<n;i++)for(let j=0;j<i;j++){let v=values[i][j];$('auto-'+j+'-'+i).textContent=v===null?'':String(-v);if(v!==null){sums[i]+=v;sums[j]-=v}}sums.forEach((v,j)=>$('total-'+j).textContent=v);return sums};function updateLabels(){document.querySelectorAll('[data-player]').forEach(x=>x.textContent=player(+x.dataset.player))};function renderHistory(){let html='<table class="history"><thead><tr><th>局</th>';for(let j=0;j<n;j++)html+=`<th>${player(j)}</th>`;html+='</tr></thead><tbody>';records.forEach((r,i)=>{html+=`<tr><th>${i+1}</th>`;r.forEach(v=>html+=`<td>${v}</td>`);html+='</tr>'});html+='</tbody><tfoot><tr><th>累計</th>';for(let j=0;j<n;j++)html+=`<td>${records.reduce((a,r)=>a+(r[j]||0),0)}</td>`;html+='</tr></tfoot></table>';$('history').innerHTML=html};$('count').addEventListener('change',e=>{let next=Number(e.target.value);if(next===n)return;if(!confirm(`確定切換成 ${next} 人？目前的歷史紀錄會清除。`)){e.target.value=String(n);return}n=next;names=Array(n).fill('');records=[];persist();render();$('status').textContent='已切換為 '+n+' 人'});$('save').addEventListener('click',()=>{if(records.length>=20){alert('最多紀錄20局，請先撤銷或清除紀錄。');return}let inputs=[...document.querySelectorAll('#score input')];if(inputs.some(x=>x.value.trim()===''||!Number.isFinite(Number(x.value))||!Number.isInteger(Number(x.value)))){alert('請先填妥全部黃色格子的整數分數（可以填0或負數）。');return}records.push(updateScores());persist();renderHistory();renderScore();$('status').textContent=`已儲存第 ${records.length} 局，輸入格已清空。`});$('clear').addEventListener('click',()=>{renderScore();$('status').textContent='本局輸入已清空'});$('undo').addEventListener('click',()=>{if(!records.length)return;if(confirm('確定撤銷上一局？')){records.pop();persist();renderHistory();$('status').textContent='已撤銷上一局'}});$('reset').addEventListener('click',()=>{if(confirm('確定清除全部歷史紀錄？')){records=[];persist();renderHistory();$('status').textContent='歷史紀錄已清除'}});render()})();
</script></body></html>
